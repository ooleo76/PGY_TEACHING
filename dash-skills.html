<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能評估　Dashboard</title>
<style>
:root{
  --ink:#1F2D2A;--deep:#16332E;--teal:#157A6E;--teald:#0E5A50;--teall:#9AD4CA;
  --card:#EEF4F2;--card2:#DCE9E6;--mute:#6B807A;--brick:#C8553D;--ochre:#B8863B;
  --paper:#F5F7F6;--line:#D4DEDB;
  --num:"Calibri","Segoe UI",system-ui,sans-serif;
  --sans:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 60px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.top{background:var(--deep);color:#fff}
.top .in{max-width:1040px;margin:0 auto;padding:22px 16px 18px;
  display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:21px;font-weight:700}
.top .eyebrow{font-family:var(--num);font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--teall);margin:0 0 6px}
.top .ctl{margin-left:auto;display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
.ctl .f label{display:block;font-size:10px;letter-spacing:.09em;color:#A9C9C1;
  text-transform:uppercase;font-family:var(--num);margin-bottom:4px}
.ctl select,.ctl input{padding:7px 9px;border:1px solid #3A554F;border-radius:3px;
  background:#22403A;color:#fff;font-family:inherit;font-size:14px;min-width:112px}
.ctl select:focus,.ctl input:focus{outline:2px solid var(--teall);outline-offset:-1px}
.ctl button{padding:8px 13px;border-radius:3px;border:1px solid #3A554F;background:#22403A;
  color:#fff;font-family:inherit;font-size:13px;cursor:pointer}
.ctl button:hover{background:var(--teal);border-color:var(--teal)}

.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabs .in{max-width:1040px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:12px 14px;
  font-family:inherit;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--teald);border-bottom-color:var(--teal);font-weight:700}
.tabs button:hover{background:var(--card)}

.status{max-width:1040px;margin:0 auto;padding:10px 16px 0;font-size:12px;color:var(--mute)}
.pane{display:none}.pane.on{display:block}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:4px;padding:13px 15px;
  border-left:3px solid var(--teal)}
.kpi .k{font-size:11px;color:var(--mute);letter-spacing:.06em}
.kpi .v{font-family:var(--num);font-size:29px;font-weight:700;line-height:1.15;margin-top:3px}
.kpi .v small{font-size:14px;font-weight:400;color:var(--mute)}
.kpi .s{font-size:11.5px;color:var(--mute);margin-top:2px}
.kpi.warn{border-left-color:var(--brick)}
.kpi.warn .v{color:var(--brick)}

.card{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:4px}
.ch{padding:11px 15px;border-bottom:1px solid var(--line);background:var(--card);
  font-weight:700;font-size:15px;display:flex;align-items:baseline;gap:10px}
.ch small{margin-left:auto;font-weight:400;color:var(--mute);font-size:11.5px}
.cb{padding:14px 15px}

.bar{display:grid;grid-template-columns:150px 1fr 66px;gap:11px;align-items:center;
  margin-bottom:8px;font-size:13px}
.bar .n{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{position:relative;height:17px;background:var(--card);border-radius:2px;overflow:hidden}
.fl{height:100%;background:var(--teal);transition:width .3s ease}
.fl.b{background:var(--teall)}
.bar .v{font-family:var(--num);font-size:12.5px;font-weight:700;text-align:right;color:var(--mute)}
.dual{display:flex;gap:3px;flex-direction:column}
.dual .tr{height:8px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid #EDF2F0;text-align:left}
th{background:var(--card);font-size:12px;color:var(--mute);letter-spacing:.05em;
  position:sticky;top:0;font-weight:700}
td.n,th.n{text-align:right;font-family:var(--num)}
tbody tr:hover{background:#FBFCFC;cursor:pointer}
tbody tr.sel{background:#F1F7F5}
.pill{display:inline-block;font-family:var(--num);font-size:11px;font-weight:700;
  padding:2px 7px;border-radius:10px}
.p-hi{background:var(--card2);color:var(--teald)}
.p-md{background:#FCF4E3;color:#8A6420}
.p-lo{background:#F7E2DC;color:var(--brick)}
.scroll{max-height:460px;overflow:auto}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);
  padding:0 15px 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;
  vertical-align:-1px}

.empty{padding:28px 15px;text-align:center;color:var(--mute);font-size:13.5px;line-height:1.9}
.phrase{display:grid;grid-template-columns:1fr 60px 44px;gap:10px;align-items:center;
  padding:7px 0;border-top:1px solid #F2F6F5;font-size:13px}
.phrase:first-child{border-top:none}
.phrase .t{line-height:1.5}
.phrase .tr{height:11px}
.phrase .v{font-family:var(--num);font-size:12px;font-weight:700;text-align:right;color:var(--mute)}
.dom-h{font-size:12px;font-weight:700;color:var(--teald);margin:13px 0 4px;
  padding-top:9px;border-top:1px solid var(--line)}
.dom-h:first-child{border-top:none;padding-top:0;margin-top:0}
.gap{display:grid;grid-template-columns:150px 1fr;gap:11px;align-items:center;
  margin-bottom:7px;font-size:13px}
.gapbar{position:relative;height:20px;background:var(--card);border-radius:2px}
.gapbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.gapbar .seg{position:absolute;top:3px;height:14px;border-radius:2px}
.gapbar .lbl{position:absolute;top:1px;font-family:var(--num);font-size:11px;color:var(--mute)}

@media (max-width:640px){
  .top .in{flex-direction:column;align-items:stretch}
  .top .ctl{margin-left:0;width:100%}
  .ctl .f{flex:1 1 45%}
  .ctl select,.ctl input{width:100%;min-width:0;font-size:16px;padding:11px 9px}
  .bar{grid-template-columns:104px 1fr 50px;gap:8px;font-size:12px}
  .phrase{grid-template-columns:1fr 44px 38px}
  .gap{grid-template-columns:100px 1fr}
  th,td{padding:7px 6px;font-size:12.5px}
}
@media (pointer:coarse){ .tabs button{padding:14px 15px} .ctl button{min-height:44px} }
</style>
</head>
<body>

<div class="top"><div class="in">
  <div>
    <p class="eyebrow">Emergency Medicine · PGY</p>
    <h1>技能評估　Dashboard</h1>
  </div>
  <div class="ctl">
    <div class="f"><label>學年度</label><select id="fYear"></select></div>
    <div class="f"><label>課程</label><select id="fCourse"></select></div>
    <div class="f"><label>次序</label><select id="fRound"></select></div>
    <div class="f"><label>搜尋學員</label><input id="fQ" type="search" placeholder="姓名或人事號"></div>
    <button type="button" onclick="reload(true)">重新整理</button>
  </div>
</div></div>

<div class="tabs"><div class="in">
  <button class="on" data-p="overview">總覽</button>
  <button data-p="students">學員清單</button>
  <button data-p="person">個人檢視</button>
  <button data-p="phrases">問題熱點</button>
  <button data-p="epa">EPA 對照</button>
</div></div>

<div class="status" id="status">載入中…</div>

<div class="wrap">
  <div class="pane on" id="p-overview"></div>
  <div class="pane" id="p-students"></div>
  <div class="pane" id="p-person"></div>
  <div class="pane" id="p-phrases"></div>
  <div class="pane" id="p-epa"></div>
</div>

<script src="phrases.js"></script>
<script src="common.js"></script>
<script>
const DOM_KEYS=[["hx","病史收集",1],["pe","理學檢查",1],["tx","處置與治療",1],
  ["lab","檢驗檢查",1],["ho","交班報告",1],["prep","插管前準備",2],["med","藥物給予",2],
  ["tech","插管技術",2],["post","插管後評估",2]];
const SAFE_COLS=[["安全_升階氧氣","升階氧氣優先"],["安全_Preox","Preoxygenation"],
  ["安全_確認血壓","給藥前確認血壓"],["安全_掉血氧中止","掉血氧中止給氧"],
  ["安全_EtCO2波形","EtCO₂ 波形確認"]];
const CACHE_KEY="skillsDashCache";
let RAW={scores:[],texts:[]}, CUR=null;

/* ---------- 載入：先畫快取，再抓新的 ---------- */
async function reload(force){
  const st=document.getElementById("status");
  if(!force){
    try{
      const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
      if(c&&c.data){ RAW=c.data; render();
        st.textContent=`顯示本機快取（${new Date(c.at).toLocaleString("zh-TW")}），背景更新中…`; }
    }catch(e){}
  }
  if(!GAS_URL){ st.textContent="尚未設定 GAS_URL，無法連線試算表。"; return; }
  try{
    const r=await fetch(GAS_URL+"?action=skills",{method:"GET"});
    const j=await r.json();
    RAW={scores:j.scores||[],texts:j.texts||[]};
    localStorage.setItem(CACHE_KEY,JSON.stringify({at:Date.now(),data:RAW}));
    render();
    st.textContent=`資料更新於 ${new Date().toLocaleString("zh-TW")}　·　共 ${RAW.scores.length} 筆評分`;
  }catch(e){
    st.textContent="連線失敗，顯示的是本機快取。";
  }
}

/* ---------- 篩選 ---------- */
function fillFilters(){
  const yrs=[...new Set(RAW.scores.map(r=>String(r["學年度"]||"")))].filter(Boolean).sort().reverse();
  const crs=[...new Set(RAW.scores.map(r=>String(r["課程"]||"呼吸道擬真")))].filter(Boolean).sort();
  const rds=[...new Set(RAW.scores.map(r=>String(r["施測次序"]||"")))].filter(Boolean);
  const set=(id,arr,all)=>{
    const s=document.getElementById(id), keep=s.value;
    s.innerHTML=`<option value="">${all}</option>`+arr.map(x=>`<option>${x}</option>`).join("");
    if([...s.options].some(o=>o.value===keep)) s.value=keep;
  };
  set("fYear",yrs,"全部年度"); set("fCourse",crs,"全部課程"); set("fRound",rds,"全部次序");
}
function rows(){
  const y=g("fYear"), c=g("fCourse"), r=g("fRound"), q=g("fQ").toLowerCase();
  return RAW.scores.filter(x=>
    (!y||String(x["學年度"])===y) &&
    (!c||String(x["課程"]||"呼吸道擬真")===c) &&
    (!r||String(x["施測次序"])===r) &&
    (!q||String(x["姓名"]||"").toLowerCase().includes(q)||
         String(x["人事號"]||"").toLowerCase().includes(q)));
}
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const pill=v=>v===null?'<span class="pill">—</span>':
  `<span class="pill ${v>=4?"p-hi":v>=3?"p-md":"p-lo"}">${v.toFixed(1)}</span>`;

/* ---------- 總覽 ---------- */
function paneOverview(R){
  if(!R.length) return `<div class="card"><div class="empty">此條件下沒有資料。<br>試著放寬年度或課程篩選。</div></div>`;
  const st1=R.map(r=>num(r["站一分數"])).filter(v=>v!==null);
  const st2=R.map(r=>num(r["站二分數"])).filter(v=>v!==null);
  const people=new Set(R.map(r=>r["人事號"])).size;
  const safeFail=R.filter(r=>SAFE_COLS.some(([c])=>String(r[c])==="n")).length;
  const first=R.map(r=>String(r["首次插管成功"])).filter(v=>v==="y"||v==="n");
  const firstRate=first.length?Math.round(first.filter(v=>v==="y").length/first.length*100):null;

  let h=`<div class="kpis">
    <div class="kpi"><div class="k">評估筆數</div><div class="v">${R.length}</div>
      <div class="s">${people} 位學員</div></div>
    <div class="kpi"><div class="k">站一　呼吸困難</div>
      <div class="v">${st1.length?Math.round(avg(st1)):"—"}<small>%</small></div>
      <div class="s">n=${st1.length}</div></div>
    <div class="kpi"><div class="k">站二　插管</div>
      <div class="v">${st2.length?Math.round(avg(st2)):"—"}<small>%</small></div>
      <div class="s">n=${st2.length}</div></div>
    <div class="kpi"><div class="k">首次插管成功率</div>
      <div class="v">${firstRate===null?"—":firstRate}<small>%</small></div>
      <div class="s">n=${first.length}</div></div>
    <div class="kpi ${safeFail?"warn":""}"><div class="k">含安全項未達成</div>
      <div class="v">${safeFail}</div>
      <div class="s">${R.length?Math.round(safeFail/R.length*100):0}% 的評估</div></div>
  </div>`;

  // 面向平均
  h+=`<div class="card"><div class="ch">九面向平均<small>1–5 分</small></div><div class="cb">`;
  DOM_KEYS.forEach(([k,nm,st])=>{
    const a=R.map(r=>num(r[nm])).filter(v=>v!==null), m=avg(a);
    h+=`<div class="bar"><span class="n">${st===1?"Ⅰ":"Ⅱ"}·${nm}</span>
      <span class="tr"><span class="fl" style="width:${m?m/5*100:0}%;background:${
        !m?"var(--card)":m>=4?"var(--teal)":m>=3?"var(--ochre)":"var(--brick)"}"></span></span>
      <span class="v">${m?m.toFixed(1):"—"}</span></div>`;
  });
  h+=`</div></div>`;

  // 安全項
  h+=`<div class="card"><div class="ch">安全關鍵項達成率</div><div class="cb">`;
  SAFE_COLS.forEach(([c,nm])=>{
    const v=R.map(r=>String(r[c])).filter(x=>x==="y"||x==="n");
    const rate=v.length?Math.round(v.filter(x=>x==="y").length/v.length*100):null;
    h+=`<div class="bar"><span class="n">${nm}</span>
      <span class="tr"><span class="fl" style="width:${rate||0}%;background:${
        rate===null?"var(--card)":rate>=80?"var(--teal)":rate>=60?"var(--ochre)":"var(--brick)"}"></span></span>
      <span class="v">${rate===null?"—":rate+"%"}</span></div>`;
  });
  h+=`</div></div>`;
  return h;
}

/* ---------- 學員清單 ---------- */
function paneStudents(R){
  if(!R.length) return `<div class="card"><div class="empty">此條件下沒有資料。</div></div>`;
  const by={};
  R.forEach(r=>{const k=r["人事號"]||r["姓名"];(by[k]=by[k]||[]).push(r);});
  const list=Object.entries(by).map(([k,rs])=>{
    rs.sort((a,b)=>String(a["評估日期"]).localeCompare(String(b["評估日期"])));
    const last=rs[rs.length-1], first=rs[0];
    const d=(a,b)=>{const x=num(a),y=num(b);return x!==null&&y!==null?y-x:null;};
    return {eid:k,name:last["姓名"],batch:last["梯次"],n:rs.length,
      st1:num(last["站一分數"]),st2:num(last["站二分數"]),
      d1:rs.length>1?d(first["站一分數"],last["站一分數"]):null,
      d2:rs.length>1?d(first["站二分數"],last["站二分數"]):null,
      epa1:num(last["EPA_呼吸困難"]),epa2:num(last["EPA_插管"]),
      safe:rs.some(r=>SAFE_COLS.some(([c])=>String(r[c])==="n")),
      date:last["評估日期"]};
  }).sort((a,b)=>(a.st1??999)-(b.st1??999));

  const dl=v=>v===null?'<span style="color:var(--mute)">—</span>':
    v>0?`<span style="color:var(--teald)">▲${v.toFixed(0)}</span>`:
    v<0?`<span style="color:var(--brick)">▼${Math.abs(v).toFixed(0)}</span>`:"—";

  return `<div class="card"><div class="ch">學員清單<small>點列可看個人檢視　·　依站一分數由低至高</small></div>
    <div class="scroll"><table><thead><tr>
      <th>人事號</th><th>姓名</th><th>梯</th><th class="n">次數</th>
      <th class="n">站一</th><th class="n">進步</th><th class="n">站二</th><th class="n">進步</th>
      <th class="n">EPA</th><th>安全</th><th>最近</th></tr></thead><tbody>`+
    list.map(s=>`<tr onclick="showPerson('${s.eid}')">
      <td class="num">${s.eid||""}</td><td>${s.name||""}</td><td>${s.batch||""}</td>
      <td class="n">${s.n}</td>
      <td class="n">${s.st1===null?"—":s.st1}</td><td class="n">${dl(s.d1)}</td>
      <td class="n">${s.st2===null?"—":s.st2}</td><td class="n">${dl(s.d2)}</td>
      <td class="n">${s.epa1||"—"}／${s.epa2||"—"}</td>
      <td>${s.safe?'<span class="pill p-lo">未達成</span>':'<span class="pill p-hi">✓</span>'}</td>
      <td class="num">${fmtDate(s.date)}</td></tr>`).join("")+
    `</tbody></table></div></div>`;
}
function fmtDate(d){
  if(!d) return "";
  const s=String(d); const m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[2]+"/"+m[3];
  const dd=new Date(s); return isNaN(dd)?s.slice(0,10):
    String(dd.getMonth()+1).padStart(2,"0")+"/"+String(dd.getDate()).padStart(2,"0");
}

/* ---------- 個人檢視 ---------- */
function showPerson(eid){ CUR=eid; switchTab("person"); }
function panePerson(){
  const R=rows();
  if(!CUR) return `<div class="card"><div class="empty">
    請先到「學員清單」點選一位學員，或在右上角搜尋。</div></div>`;
  const rs=RAW.scores.filter(r=>String(r["人事號"])===String(CUR))
    .sort((a,b)=>String(a["評估日期"]).localeCompare(String(b["評估日期"])));
  if(!rs.length) return `<div class="card"><div class="empty">查無此學員的評分紀錄。</div></div>`;
  const last=rs[rs.length-1], prev=rs.length>1?rs[0]:null;

  let h=`<div class="kpis">
    <div class="kpi"><div class="k">學員</div>
      <div class="v" style="font-size:22px">${last["姓名"]||CUR}</div>
      <div class="s">${CUR}　${last["梯次"]?last["梯次"]+" 梯":""}　${last["職級"]||""}</div></div>
    <div class="kpi"><div class="k">施測次數</div><div class="v">${rs.length}</div>
      <div class="s">最近 ${fmtDate(last["評估日期"])}</div></div>
    <div class="kpi"><div class="k">站一　呼吸困難</div>
      <div class="v">${last["站一分數"]||"—"}<small>%</small></div>
      <div class="s">${prev?"首次 "+(prev["站一分數"]||"—")+"%":"僅一次"}</div></div>
    <div class="kpi"><div class="k">站二　插管</div>
      <div class="v">${last["站二分數"]||"—"}<small>%</small></div>
      <div class="s">${prev?"首次 "+(prev["站二分數"]||"—")+"%":"僅一次"}</div></div>
  </div>`;

  h+=`<div class="card"><div class="ch">九面向剖面
    <small>${prev?"淺色＝首次　深色＝最近":"單次評估"}</small></div><div class="cb">`;
  DOM_KEYS.forEach(([k,nm,st])=>{
    const a=num(last[nm]), b=prev?num(prev[nm]):null;
    h+=`<div class="bar"><span class="n">${st===1?"Ⅰ":"Ⅱ"}·${nm}</span>
      <span class="dual">${b!==null?`<span class="tr"><span class="fl b"
        style="width:${b/5*100}%"></span></span>`:""}
        <span class="tr"><span class="fl" style="width:${a?a/5*100:0}%;background:${
          !a?"var(--card)":a>=4?"var(--teal)":a>=3?"var(--ochre)":"var(--brick)"}"></span></span></span>
      <span class="v">${a||"—"}${b!==null?` <span style="color:var(--mute)">(${b})</span>`:""}</span></div>`;
  });
  h+=`</div></div>`;

  // 安全項
  const bad=SAFE_COLS.filter(([c])=>String(last[c])==="n");
  if(bad.length) h+=`<div class="card" style="border-left:3px solid var(--brick)">
    <div class="ch" style="color:var(--brick)">安全關鍵項未達成</div><div class="cb">
    ${bad.map(([,nm])=>"· "+nm).join("<br>")}</div></div>`;

  // 回饋語句
  const tx=RAW.texts.filter(t=>String(t["人事號"])===String(CUR))
    .sort((a,b)=>String(a["評估日期"]).localeCompare(String(b["評估日期"])));
  h+=`<div class="card"><div class="ch">回饋語句<small>來自助理端回饋表</small></div><div class="cb">`;
  if(!tx.length) h+=`<div class="empty" style="padding:12px 0">尚無對應的回饋語句。<br>
    可能是助理尚未填寫，或人事號／日期未對上。</div>`;
  else{
    const latest=tx.filter(t=>String(t["評估日期"])===String(tx[tx.length-1]["評估日期"]));
    latest.forEach(t=>{
      // 新結構：一列兩站併排；舊結構：一站一列（仍相容）
      const stations = t["呼吸困難_語句文字"]!==undefined || t["插管_語句文字"]!==undefined
        ? [["呼吸困難", t["呼吸困難_語句文字"], t["呼吸困難_語句代碼"]],
           ["插管",     t["插管_語句文字"],     t["插管_語句代碼"]]]
        : [[t["站別"]||"", t["語句文字"], t["語句代碼"]]];
      stations.forEach(([stName, txt, codes])=>{
        if(!String(txt||"").trim() && !String(codes||"").trim()) return;
        h+=`<div class="dom-h">${stName}　${fmtDate(t["評估日期"])}</div>`;
        const lines=String(txt||"").split("\n").filter(x=>x.trim());
        if(lines.length){
          lines.forEach(l=>{
            const m=l.match(/^\[([^\]]+)\]([◎·])?\s*(.*)$/);
            const dom=m?m[1]:"", good=m&&m[2]==="◎", body=m?m[3]:l;
            h+=`<div style="font-size:13px;padding:3px 0 3px 10px">
              <span style="color:var(--teald);font-weight:700">${dom}</span>
              <span style="color:${good?"var(--teald)":"var(--ink)"}">　${good?"◎":"·"} ${body}</span></div>`;
          });
        }else{
          String(codes||"").split(";").filter(Boolean).forEach(c=>
            h+=`<div style="font-size:13px;padding:3px 0 3px 10px">
              <span style="color:var(--teald);font-weight:700">${phraseDomain(c)}</span>　· ${phraseText(c)}</div>`);
        }
      });
      if(t["學習建議"]) h+=`<div style="font-size:12.5px;padding:6px 0 0 10px;color:var(--mute)">
        學習建議：${t["學習建議"]}</div>`;
      if(t["額外建議"]) h+=`<div style="font-size:13px;padding:5px 0 0 10px;color:var(--mute)">
        ${String(t["額外建議"]).replace(/\n/g,"<br>")}</div>`;
    });
  }
  h+=`</div></div>`;
  return h;
}

/* ---------- 問題熱點 ---------- */
function panePhrases(){
  const y=g("fYear");
  const tx=RAW.texts.filter(t=>!y||String(t["學年度"])===y);
  if(!tx.length) return `<div class="card"><div class="empty">尚無回饋語句資料。</div></div>`;
  const n=new Set(tx.map(t=>String(t["人事號"])+"|"+String(t["評估日期"]))).size||1;
  const cnt={};
  tx.forEach(t=>{
    [t["呼吸困難_語句代碼"], t["插管_語句代碼"], t["語句代碼"]].forEach(v=>
      String(v||"").split(";").filter(Boolean).forEach(c=>cnt[c]=(cnt[c]||0)+1));
  });

  let h=`<div class="card"><div class="ch">問題熱點
    <small>${n} 份評估　·   百分比＝該句被選中的比率</small></div><div class="cb">`;
  DOM_KEYS.forEach(([k,nm])=>{
    const items=(P[k]?.items||[]).map(it=>({...it,c2:cnt[it.c]||0}))
      .filter(it=>it.c2>0).sort((a,b)=>b.c2-a.c2);
    if(!items.length) return;
    h+=`<div class="dom-h">${nm}</div>`;
    items.forEach(it=>{
      const pc=Math.round(it.c2/n*100);
      h+=`<div class="phrase"><span class="t">${it.p==="pos"?"◎ ":""}${it.t}</span>
        <span class="tr"><span class="fl" style="width:${pc}%;background:${
          it.p==="pos"?"var(--teall)":pc>=50?"var(--brick)":"var(--ochre)"}"></span></span>
        <span class="v">${pc}%</span></div>`;
    });
  });
  h+=`</div><div class="legend">
    <span><i style="background:var(--teall)"></i>正向語句</span>
    <span><i style="background:var(--brick)"></i>出現率 ≥50%（共通弱點，可考慮調整課程）</span>
    <span><i style="background:var(--ochre)"></i>出現率 &lt;50%</span></div></div>`;
  return h;
}

/* ---------- EPA 對照 ---------- */
function paneEpa(R){
  if(!R.length) return `<div class="card"><div class="empty">此條件下沒有資料。</div></div>`;
  let h=`<div class="card"><div class="ch">EPA 等級分布<small>教師評定</small></div><div class="cb">`;
  [["EPA_呼吸困難","呼吸困難評估"],["EPA_插管","氣管內管插管"]].forEach(([c,nm])=>{
    const v=R.map(r=>num(r[c])).filter(x=>x!==null);
    h+=`<div class="dom-h">${nm}　<span style="font-weight:400;color:var(--mute)">n=${v.length}${
      v.length?"　平均 "+avg(v).toFixed(2):""}</span></div>`;
    [1,2,3,4,5].forEach(lv=>{
      const c2=v.filter(x=>x===lv).length, pc=v.length?Math.round(c2/v.length*100):0;
      h+=`<div class="bar"><span class="n">等級 ${lv}</span>
        <span class="tr"><span class="fl" style="width:${pc}%"></span></span>
        <span class="v">${c2} 人 ${pc}%</span></div>`;
    });
  });
  h+=`</div></div>`;

  // 分數 vs EPA 一致性
  h+=`<div class="card"><div class="ch">分數與 EPA 的一致性
    <small>落差 ≥2 級者須於備註說明</small></div><div class="cb">`;
  const band=pc=>pc<60?[1,2]:pc<70?[2,2]:pc<80?[3,3]:pc<90?[3,4]:[4,5];
  const off=[];
  R.forEach(r=>{
    [["站一分數","EPA_呼吸困難","呼吸困難"],["站二分數","EPA_插管","插管"]].forEach(([sc,ec,nm])=>{
      const s=num(r[sc]), e=num(r[ec]);
      if(s===null||e===null) return;
      const b=band(s), gap=e<b[0]?b[0]-e:e>b[1]?e-b[1]:0;
      if(gap>=2) off.push({name:r["姓名"],eid:r["人事號"],date:r["評估日期"],nm,s,e,gap,b});
    });
  });
  h+= off.length
    ? `<table><thead><tr><th>學員</th><th>站別</th><th class="n">分數</th>
        <th class="n">預期 EPA</th><th class="n">實際</th><th class="n">落差</th><th>日期</th></tr></thead><tbody>`+
      off.sort((a,b)=>b.gap-a.gap).map(o=>`<tr><td>${o.name||o.eid}</td><td>${o.nm}</td>
        <td class="n">${o.s}%</td><td class="n">${o.b[0]}${o.b[1]!==o.b[0]?"–"+o.b[1]:""}</td>
        <td class="n">${o.e}</td><td class="n"><span class="pill p-lo">${o.gap}</span></td>
        <td class="num">${fmtDate(o.date)}</td></tr>`).join("")+`</tbody></table>`
    : `<div class="empty" style="padding:14px 0">沒有落差 ≥2 級的紀錄，分數與 EPA 判斷一致。</div>`;
  h+=`</div></div>`;
  return h;
}

/* ---------- 描繪 ---------- */
function render(){
  fillFilters();
  const R=rows();
  document.getElementById("p-overview").innerHTML=paneOverview(R);
  document.getElementById("p-students").innerHTML=paneStudents(R);
  document.getElementById("p-person").innerHTML=panePerson();
  document.getElementById("p-phrases").innerHTML=panePhrases();
  document.getElementById("p-epa").innerHTML=paneEpa(R);
}
function switchTab(p){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  document.querySelectorAll(".pane").forEach(x=>x.classList.toggle("on",x.id==="p-"+p));
  if(p==="person") document.getElementById("p-person").innerHTML=panePerson();
  window.scrollTo?.({top:0,behavior:"smooth"});
}
document.querySelectorAll(".tabs button").forEach(b=>
  b.addEventListener("click",()=>switchTab(b.dataset.p)));
["fYear","fCourse","fRound"].forEach(id=>
  document.getElementById(id).addEventListener("change",render));
let qT; document.getElementById("fQ").addEventListener("input",()=>{
  clearTimeout(qT); qT=setTimeout(render,220);});
reload();
</script>
